<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lecturer Hub | Swiss Modern</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- ORIGINAL PROTECTION LOGIC ---
        (function protectPage() {
            const role = sessionStorage.getItem('userRole');
            if (role !== 'lecturer') { 
                // window.location.href = 'index.html'; 
            }
        })();
    </script>

    <style>
        :root {
            --bg: #F2F2F2;
            --fg: #000000;
            --accent: #0071E3;
            --success: #34C759;
            --warning: #FF9500;
            --border-width: 3px;
            --shadow: 8px 8px 0px #000000;
            --card-bg: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            padding-bottom: 120px;
        }

        .grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(#ddd 1px, transparent 1px), linear-gradient(90deg, #ddd 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        /* --- Header --- */
        header {
            padding: 24px;
            background: white;
            border-bottom: var(--border-width) solid var(--fg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand { font-weight: 800; text-transform: uppercase; letter-spacing: -1px; font-size: 20px; }
        .sys-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; background: #000; color: #fff; padding: 4px 8px; }

        /* --- Main Layout --- */
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .panel-label {
            font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
            color: #999; margin: 25px 0 12px; display: block;
        }

        .card {
            background: var(--card-bg);
            border: var(--border-width) solid var(--fg);
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 30px;
        }

        h2 { font-size: 28px; font-weight: 800; text-transform: uppercase; margin-bottom: 25px; line-height: 0.9; }

        /* --- Form Elements --- */
        .field { margin-bottom: 24px; }
        label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
        
        input {
            width: 100%; padding: 16px;
            border: var(--border-width) solid var(--fg);
            font-family: inherit; font-size: 16px; font-weight: 600;
            background: #f9f9f9;
        }
        input:focus { outline: none; background: #fff; border-color: var(--accent); }
        input[readonly] { background: #E0F0FF; color: var(--accent); text-align: center; font-family: 'JetBrains Mono'; font-size: 24px; }

        .map-container {
            height: 250px; border: var(--border-width) solid var(--fg);
            margin-bottom: 20px; position: relative; overflow: hidden;
        }

        button {
            width: 100%; padding: 20px;
            background: var(--fg); color: white;
            border: var(--border-width) solid var(--fg);
            font-family: inherit; font-weight: 800; text-transform: uppercase;
            cursor: pointer; transition: 0.1s;
            display: flex; justify-content: space-between; align-items: center;
        }

        button:active { transform: translate(4px, 4px); box-shadow: none; }
        button.secondary { background: var(--accent); border-color: var(--fg); }

        /* --- Live Monitoring UI --- */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .stat-box { 
            border: var(--border-width) solid var(--fg); 
            padding: 20px; background: #fff; text-align: left;
        }
        .stat-num { font-size: 40px; font-weight: 800; display: block; line-height: 1; margin-top: 10px; }
        .stat-status { color: var(--success); font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; }

        .log-container {
            border: var(--border-width) solid var(--fg);
            max-height: 400px; overflow-y: auto; background: #fff;
        }
        .log-item {
            padding: 15px 20px; border-bottom: 1px solid #eee;
            display: flex; justify-content: space-between; align-items: center;
        }
        .log-item:last-child { border-bottom: none; }
        .log-name { font-weight: 700; font-size: 14px; }
        .log-id { font-family: 'JetBrains Mono'; font-size: 11px; color: #888; }
        .log-time { font-family: 'JetBrains Mono'; font-size: 12px; font-weight: 700; }

        /* --- History List --- */
        .history-card {
            background: white; border: var(--border-width) solid var(--fg);
            padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between;
        }
        .history-info h4 { font-weight: 800; text-transform: uppercase; font-size: 16px; }
        .history-info p { font-size: 12px; color: #666; margin-top: 4px; }
        .history-ref { background: #000; color: #fff; padding: 4px 8px; font-family: 'JetBrains Mono'; font-size: 12px; align-self: flex-start; }

        /* --- Navigation Dock --- */
        .dock-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; padding: 8px;
            background: white; border: var(--border-width) solid var(--fg);
            box-shadow: var(--shadow); z-index: 2000;
        }
        .dock-item {
            padding: 12px 20px; cursor: pointer; display: flex; flex-direction: column;
            align-items: center; gap: 4px; transition: 0.2s; border-radius: 4px;
        }
        .dock-item.active { background: var(--fg); color: white; }
        .dock-item i { font-size: 20px; }
        .dock-item span { font-size: 10px; font-weight: 800; text-transform: uppercase; }

        /* --- Transitions --- */
        .panel { display: none; }
        .panel.active { display: block; animation: panelIn 0.3s ease-out; }
        @keyframes panelIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <header>
        <div class="brand">Control_Center</div>
        <div class="sys-tag">SESSION.MANAGER.v1</div>
    </header>

    <main>
        <!-- PANEL: CREATE -->
        <div id="panel-create" class="panel">
            <span class="panel-label">Session Initialization</span>
            <div class="card">
                <h2>Deploy New Node</h2>
                <form id="attendance-form">
                    <div class="field">
                        <label>Course Identifier</label>
                        <input type="text" id="course" placeholder="e.g. ADVANCED_ALGORITHMS" required>
                    </div>

                    <label>Geofence Target</label>
                    <div class="map-container" id="map"></div>
                    
                    <div class="field">
                        <label>Coordinates (Auto-Fill)</label>
                        <input type="text" id="coords" placeholder="Lat, Lng" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="field">
                            <label>Venue Code</label>
                            <input type="text" id="venue-name" placeholder="L_HALL_A" required>
                        </div>
                        <div class="field">
                            <label>Reference Pin</label>
                            <input type="text" id="ref-code" readonly>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <div class="field">
                            <label>Start Window</label>
                            <input type="time" id="time-in" required>
                        </div>
                        <div class="field">
                            <label>Closure Time</label>
                            <input type="time" id="time-out" required>
                        </div>
                    </div>

                    <div class="field">
                        <label>Auth Email</label>
                        <input type="email" id="lecturer-email" placeholder="lecturer@edu.com" required>
                    </div>

                    <button type="submit">
                        Broadcast Signal <i class="fa-solid fa-tower-broadcast"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- PANEL: LIVE -->
        <div id="panel-live" class="panel active">
            <span class="panel-label">Live Telemetry Stream</span>
            <div class="card">
                <h2>Real-Time Sync</h2>
                
                <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                    <input type="text" id="search-ref" placeholder="Enter Ref Pin" style="flex: 2;">
                    <button class="secondary" style="flex: 1; padding: 0 15px;" onclick="checkAttendanceAct()">
                        Sync <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>

                <div class="stat-grid">
                    <div class="stat-box">
                        <label>Verified Access</label>
                        <span class="stat-num" id="ui-students-found">0</span>
                    </div>
                    <div class="stat-box">
                        <label>Status</label>
                        <div class="stat-status"><i class="fa-solid fa-circle"></i> ACTIVE</div>
                    </div>
                </div>

                <label>Access Log</label>
                <div class="log-container" id="attendance-body">
                    <div style="padding: 40px; text-align: center; color: #999;">
                        <i class="fa-solid fa-inbox" style="font-size: 24px; margin-bottom: 10px; display: block;"></i>
                        Awaiting incoming signals...
                    </div>
                </div>
            </div>
        </div>

        <!-- PANEL: HISTORY -->
        <div id="panel-history" class="panel">
            <span class="panel-label">Archive Retrieval</span>
            <div class="card">
                <h2>Vault Records</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 25px;">
                    <input type="text" id="search-lec" placeholder="Staff ID (e.g. LEC-001)" style="flex: 2;">
                    <button class="secondary" style="flex: 1;" onclick="checkSessionsAct()">
                        Search <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <div id="sessions-body">
                    <!-- History populated here -->
                </div>
            </div>
        </div>
    </main>

    <nav class="dock-container">
        <div class="dock-item" id="btn-panel-create" onclick="switchPanel('panel-create')">
            <i class="fa-solid fa-plus"></i>
            <span>Deploy</span>
        </div>
        <div class="dock-item active" id="btn-panel-live" onclick="switchPanel('panel-live')">
            <i class="fa-solid fa-wave-square"></i>
            <span>Live</span>
        </div>
        <div class="dock-item" id="btn-panel-history" onclick="switchPanel('panel-history')">
            <i class="fa-solid fa-box-archive"></i>
            <span>Vault</span>
        </div>
    </nav>

    <script>
        let map, marker;
        const FORM_URL = "https://docs.google.com/forms/u/0/d/1WPcBPA3FV4Vya83NXzA7p_98l0RHsQucyD9wVRlhfl0/formResponse";

        // --- ORIGINAL LOGIC MAINTAINED ---
        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([4.2105, 101.9758], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            marker = L.marker([4.2105, 101.9758], { draggable: true }).addTo(map);
            marker.on('dragend', function() {
                const pos = marker.getLatLng();
                document.getElementById('coords').value = `${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}`;
            });
        }

        function switchPanel(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.dock-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
            if(id === 'panel-create') setTimeout(() => map.invalidateSize(), 300);
        }

        document.getElementById('attendance-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Broadcasting... <i class="fa-solid fa-spinner fa-spin"></i>';
            
            const formData = new URLSearchParams();
            formData.append('entry.12763463', document.getElementById('course').value);
            formData.append('entry.478539585', document.getElementById('coords').value);
            formData.append('entry.1749226560', document.getElementById('ref-code').value);
            formData.append('entry.2127034561', document.getElementById('time-in').value);
            formData.append('entry.528203485', document.getElementById('time-out').value);
            formData.append('entry.259351423', document.getElementById('lecturer-email').value);
            formData.append('entry.305737954', document.getElementById('venue-name').value);
            formData.append('entry.301005744', sessionStorage.getItem('userId') || 'LEC-ADMIN');

            try {
                await fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: formData });
                document.getElementById('search-ref').value = document.getElementById('ref-code').value;
                generateRefCode();
                switchPanel('panel-live');
                checkAttendanceAct();
            } catch (err) { console.error(err); }
            btn.innerHTML = originalText;
        });

        async function checkAttendanceAct() {
            const ref = document.getElementById('search-ref').value;
            const container = document.getElementById('attendance-body');
            if(!ref) return;
            container.innerHTML = '<div style="padding:40px; text-align:center;" class="sys-tag">Querying Node...</div>';
            
            const sheetID = "1iI5eSf6NkhFtD1uxkFtuPXBWX7-C0mA1h7LR8jw3JZw";
            const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=StudentAttendance&tq=` + encodeURIComponent(`SELECT * WHERE F = ${ref}`);

            try {
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substring(47).slice(0, -2));
                const rows = json.table.rows;
                container.innerHTML = "";
                document.getElementById('ui-students-found').innerText = rows.length;
                rows.forEach(r => {
                    container.innerHTML += `
                        <div class="log-item">
                            <div>
                                <div class="log-name">${r.c[2].v}</div>
                                <div class="log-id">${r.c[1].v}</div>
                            </div>
                            <div class="log-time">${r.c[0].f.split(' ')[1]}</div>
                        </div>`;
                });
                if(rows.length === 0) container.innerHTML = '<div style="padding:40px; text-align:center;">No students found for this PIN.</div>';
            } catch (e) { container.innerHTML = '<div style="padding:40px; text-align:center;">Network error during sync.</div>'; }
        }

        async function checkSessionsAct() {
            const lecId = document.getElementById('search-lec').value;
            const container = document.getElementById('sessions-body');
            if(!lecId) return;
            container.innerHTML = '<div style="padding:20px; text-align:center;">Searching Archive...</div>';
            
            const sheetID = "1iI5eSf6NkhFtD1uxkFtuPXBWX7-C0mA1h7LR8jw3JZw";
            const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=MainSessionServer&tq=` + encodeURIComponent(`SELECT * WHERE I = '${lecId}'`);

            try {
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substring(47).slice(0, -2));
                container.innerHTML = "";
                json.table.rows.forEach(r => {
                    container.innerHTML += `
                        <div class="history-card">
                            <div class="history-info">
                                <h4>${r.c[1].v}</h4>
                                <p>${r.c[0].f.split(' ')[0]} • ${r.c[6].v}</p>
                            </div>
                            <div class="history-ref">${r.c[3].v}</div>
                        </div>`;
                });
                if(json.table.rows.length === 0) container.innerHTML = '<div style="padding:40px; text-align:center;">No history found for this ID.</div>';
            } catch (e) { container.innerHTML = '<div style="padding:20px; text-align:center;">Search failed.</div>'; }
        }

        function generateRefCode() { document.getElementById('ref-code').value = Math.floor(10000 + Math.random() * 90000); }

        window.onload = () => {
            initMap();
            generateRefCode();
            const sid = sessionStorage.getItem('userId');
            if(sid) {
                document.getElementById('search-lec').value = sid;
                checkSessionsAct();
            }
        };
    </script>
</body>
</html>
