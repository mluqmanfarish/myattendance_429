<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecturer Portal | Attendance</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script>
        (function protectPage() {
            const role = sessionStorage.getItem('userRole');
            if (role !== 'lecturer') { window.location.href = 'index.html'; }
        })();
    </script>

    <style>
        :root { --primary: #0071E3; --bg: #F5F5F7; --card: #ffffff; --text: #1D1D1F; --secondary: #86868B; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

        /* --- MOBILE NAVIGATION (BOTTOM BAR) --- */
        nav { 
            position: fixed; bottom: 0; width: 100%; background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(20px); border-top: 1px solid rgba(0,0,0,0.05); 
            display: flex; justify-content: space-around; padding: 12px 0; z-index: 2000; 
        }
        nav h1 { display: none; } /* Hidden on mobile */
        nav button { 
            all: unset; display: flex; flex-direction: column; align-items: center; 
            font-size: 10px; font-weight: 600; cursor: pointer; color: var(--secondary); transition: 0.2s; 
        }
        nav button.active { color: var(--primary); }

        /* --- MAIN CONTENT --- */
        main { flex: 1; padding: 20px; padding-bottom: 100px; width: 100%; max-width: 800px; margin: 0 auto; }
        h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); }
        
        .form-row { display: flex; gap: 12px; }
        .form-group { margin-bottom: 15px; flex: 1; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--secondary); margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #D2D2D7; font-size: 15px; font-family: inherit; outline: none; }
        input:focus { border-color: var(--primary); }
        input[readonly] { background: #FBFBFD; color: var(--primary); font-weight: 700; }

        /* --- MAP AREA --- */
        #map-container { position: relative; margin-bottom: 15px; }
        #map { height: 250px; width: 100%; border-radius: 15px; border: 1px solid #D2D2D7; z-index: 1; }
        .map-hint { font-size: 11px; color: var(--secondary); margin: 8px 0; display: block; }
        
        .coord-input-area { display: flex; gap: 8px; margin-top: 8px; }

        .submit-btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 600; width: 100%; cursor: pointer; margin-top: 10px; font-size: 16px; }

        /* --- TABLE AREA --- */
        .table-container { width: 100%; overflow-x: auto; border-radius: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 13px; }
        th { background: #FBFBFD; text-align: left; padding: 12px; color: var(--secondary); font-weight: 600; }
        td { padding: 12px; border-top: 1px solid #F5F5F7; }
        .ref-pill { background: rgba(0, 113, 227, 0.1); color: var(--primary); padding: 4px 8px; border-radius: 6px; font-weight: 700; }

        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- DESKTOP ADAPTATION --- */
        @media (min-width: 768px) {
            body { flex-direction: row; }
            nav { 
                width: 240px; height: 100vh; position: sticky; top: 0; flex-direction: column; 
                justify-content: flex-start; padding: 40px 20px; border-right: 1px solid rgba(0,0,0,0.05); border-top: none; 
            }
            nav h1 { display: block; font-size: 20px; margin-bottom: 40px; color: var(--primary); }
            nav button { flex-direction: row; font-size: 14px; padding: 12px; gap: 10px; border-radius: 12px; }
            nav button.active { background: var(--primary); color: white; }
            main { padding: 60px; }
            #map { height: 350px; }
        }
    </style>
</head>
<body>

    <nav>
        <h1>Lecturer Hub</h1>
        <button id="btn-add" class="active" onclick="switchPanel('add')">
            <span>➕</span> Add Session
        </button>
        <button id="btn-view" onclick="switchPanel('view')">
            <span>📋</span> Records
        </button>
        <button onclick="handleSignOut()" style="color: #FF3B30;">
            <span>🚪</span> Sign Out
        </button>
    </nav>

    <main>
        <div id="add-attendance-panel" class="panel active">
            <h2>Create GPS Session</h2>
            <div class="card">
                <form id="attendance-form">
                    <div class="form-group">
                        <label>Course Name</label>
                        <input type="text" id="course" placeholder="e.g. Data Structures" required>
                    </div>
                    
                    <div id="map-container">
                        <label>Classroom Location</label>
                        <div id="map"></div>
                        <span class="map-hint">🔍 Search, Drag marker, or type coordinates below:</span>
                        
                        <div class="coord-input-area">
                            <input type="text" id="coords" placeholder="Lat, Lng" required>
                            <button type="button" onclick="manualUpdateMap()" style="width: 80px; padding: 0 5px; font-size: 11px; border-radius: 8px; border: 1px solid #ddd; background: #eee;">Apply</button>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Ref Code</label>
                            <input type="text" id="ref-code" readonly>
                        </div>
                        <div class="form-group">
                            <label>Session Date</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Time Start</label>
                            <input type="time" id="time-in" required>
                        </div>
                        <div class="form-group">
                            <label>Time End</label>
                            <input type="time" id="time-out" required>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Create GPS Boundary</button>
                </form>
            </div>
        </div>

        <div id="view-attendance-panel" class="panel">
            <h2>Attendance Records</h2>
            <div class="card table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Ref</th>
                            <th>GPS</th>
                            <th>Window</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-body">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let map, marker, geocoder;
        const FORM_URL = "https://docs.google.com/forms/u/0/d/1WPcBPA3FV4Vya83NXzA7p_98l0RHsQucyD9wVRlhfl0/formResponse";

        function initMap() {
            // Default: Malaysia center
            const defaultPos = [4.2105, 101.9758]; 
            map = L.map('map').setView(defaultPos, 6);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            marker = L.marker(defaultPos, {draggable: true}).addTo(map);

            // Geocoder (Search)
            geocoder = L.Control.geocoder({
                defaultMarkGeocode: false,
                placeholder: "Search building...",
            })
            .on('markgeocode', function(e) {
                const center = e.geocode.center;
                map.setView(center, 18);
                marker.setLatLng(center);
                updateCoordInput(center.lat, center.lng);
            })
            .addTo(map);

            // Click map to move marker
            map.on('click', (e) => {
                marker.setLatLng(e.latlng);
                updateCoordInput(e.latlng.lat, e.latlng.lng);
            });

            // Drag marker
            marker.on('dragend', () => {
                const pos = marker.getLatLng();
                updateCoordInput(pos.lat, pos.lng);
            });

            // Auto-point to current location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const currentPos = [pos.coords.latitude, pos.coords.longitude];
                    map.setView(currentPos, 18);
                    marker.setLatLng(currentPos);
                    updateCoordInput(currentPos[0], currentPos[1]);
                }, () => { console.log("Location access denied"); });
            }
        }

        function updateCoordInput(lat, lng) {
            document.getElementById('coords').value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        }

        function manualUpdateMap() {
            const input = document.getElementById('coords').value;
            const parts = input.split(',');
            if (parts.length === 2) {
                const lat = parseFloat(parts[0]);
                const lng = parseFloat(parts[1]);
                if (!isNaN(lat) && !isNaN(lng)) {
                    const newPos = [lat, lng];
                    map.setView(newPos, 18);
                    marker.setLatLng(newPos);
                }
            }
        }

        function switchPanel(panelName) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(panelName + '-attendance-panel').classList.add('active');
            document.getElementById('btn-' + panelName).classList.add('active');
            if (panelName === 'add') setTimeout(() => map.invalidateSize(), 300);
        }

        async function submitSessionLog(data) {
            const formData = new URLSearchParams();
            // Google Form Field Mappings from your images
            formData.append('entry.12763463', data.course);
            formData.append('entry.478539585', data.coords);
            formData.append('entry.1749226560', data.ref);
            formData.append('entry.2127034561', data.timeIn);
            formData.append('entry.528203485', data.timeOut);

            try {
                await fetch(FORM_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
            } catch (e) { console.error("Log error", e); }
        }

        document.getElementById('attendance-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const sessionData = {
                course: document.getElementById('course').value,
                coords: document.getElementById('coords').value,
                ref: document.getElementById('ref-code').value,
                timeIn: document.getElementById('time-in').value,
                timeOut: document.getElementById('time-out').value
            };

            await submitSessionLog(sessionData);

            // Add to local UI table
            const tbody = document.getElementById('attendance-body');
            tbody.innerHTML += `<tr>
                <td>${sessionData.course}</td>
                <td><span class="ref-pill">${sessionData.ref}</span></td>
                <td><code style="font-size:10px">${sessionData.coords}</code></td>
                <td>${sessionData.timeIn}-${sessionData.timeOut}</td>
            </tr>`;

            alert("Session Active! Boundary Logged to System.");
            this.reset();
            generateRefCode();
            switchPanel('view');
        });

        function generateRefCode() {
            document.getElementById('ref-code').value = Math.floor(10000 + Math.random() * 90000);
        }

        function handleSignOut() {
            if (confirm("Sign out?")) { sessionStorage.clear(); window.location.href = 'index.html'; }
        }

        window.onload = () => {
            initMap();
            generateRefCode();
            document.getElementById('date').valueAsDate = new Date();
        };
    </script>
</body>
</html>
