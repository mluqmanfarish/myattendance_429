<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lecturer Hub | Elite</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Leaflet Resources -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        (function protectPage() {
            const role = sessionStorage.getItem('userRole');
            if (role !== 'lecturer') { window.location.href = 'index.html'; }
        })();
    </script>

    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --accent: #0071E3;
            --border-width: 2px;
            --shadow: 6px 6px 0px #000000;
            --input-bg: #f4f4f4;
            --dim: #666;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            padding-bottom: 100px; /* Space for dock */
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* --- HEADER --- */
        header {
            padding: 20px;
            border-bottom: var(--border-width) solid var(--fg);
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { font-weight: 700; text-transform: uppercase; letter-spacing: -0.5px; }
        
        .sign-out {
            border: var(--border-width) solid var(--fg);
            padding: 5px 12px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
        }

        /* --- LAYOUT --- */
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: white;
            border: var(--border-width) solid var(--fg);
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--dim);
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            display: block;
        }

        /* --- FORM ELEMENTS --- */
        .field { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
        
        input {
            width: 100%;
            padding: 15px;
            border: var(--border-width) solid var(--fg);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            font-size: 16px;
            background: var(--input-bg);
        }

        input:focus { outline: none; background: white; }

        input[readonly] { background: #fffbe6; font-weight: 700; text-align: center; }

        button {
            width: 100%;
            padding: 18px;
            background: var(--fg);
            color: white;
            border: var(--border-width) solid var(--fg);
            font-family: inherit;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: white;
            color: var(--fg);
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--fg);
        }

        /* --- MAP --- */
        #map {
            height: 250px;
            border: var(--border-width) solid var(--fg);
            margin-bottom: 20px;
        }

        /* --- TABLES & STATS --- */
        .stat-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            border: var(--border-width) solid var(--fg);
            padding: 15px;
            text-align: center;
        }

        .stat-val { font-size: 24px; font-weight: 700; display: block; }

        .table-container {
            border: var(--border-width) solid var(--fg);
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; }
        th { background: #eee; text-align: left; padding: 12px; font-size: 11px; text-transform: uppercase; border-bottom: var(--border-width) solid var(--fg); }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }

        /* --- NAVIGATION DOCK --- */
        .dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border: var(--border-width) solid var(--fg);
            box-shadow: var(--shadow);
            display: flex;
            padding: 5px;
            z-index: 1000;
        }

        .nav-item {
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--dim);
        }

        .nav-item.active { color: var(--fg); background: #f0f0f0; }
        .nav-item i { font-size: 18px; }

        /* --- PANEL CONTROL --- */
        .panel { display: none; }
        .panel.active { display: block; }

        @media (max-width: 480px) {
            main { padding: 15px; }
            .card { padding: 20px; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>

    <header>
        <div class="brand">Lec_Protocol v1.0</div>
        <div class="sign-out" onclick="handleSignOut()">Exit</div>
    </header>

    <main>
        <!-- Panel: Create Session -->
        <div id="panel-create" class="panel">
            <span class="section-label">Session Initialization</span>
            <div class="card">
                <h2>New Entry</h2>
                <form id="attendance-form">
                    <div class="field">
                        <label>Course Title</label>
                        <input type="text" id="course" placeholder="e.g. Computer Science 101" required>
                    </div>

                    <div id="map"></div>

                    <div class="field">
                        <label>Target Coordinates</label>
                        <input type="text" id="coords" placeholder="Lat, Lng" required>
                    </div>

                    <div class="field">
                        <label>Reference Identity (Auto)</label>
                        <input type="text" id="ref-code" readonly>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="field">
                            <label>Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="field">
                            <label>Venue</label>
                            <input type="text" id="venue-name" placeholder="Room A1" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="field">
                            <label>Start</label>
                            <input type="time" id="time-in" required>
                        </div>
                        <div class="field">
                            <label>End</label>
                            <input type="time" id="time-out" required>
                        </div>
                    </div>

                    <div class="field">
                        <label>Lecturer Email</label>
                        <input type="email" id="lecturer-email" required>
                    </div>

                    <button type="submit">Broadcast Session</button>
                </form>
            </div>
        </div>

        <!-- Panel: Live Logs -->
        <div id="panel-logs" class="panel active">
            <span class="section-label">Telemetry Monitoring</span>
            <div class="card">
                <h2>Attendance Stream</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="search-ref" placeholder="Enter Ref Code">
                    <button style="width: 60px; padding: 0;" onclick="checkAttendanceAct()"><i class="fa-solid fa-sync"></i></button>
                </div>

                <div class="stat-bar">
                    <div class="stat-card">
                        <span class="section-label" style="margin:0">Verified</span>
                        <span class="stat-val" id="ui-students-found">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="section-label" style="margin:0">Status</span>
                        <span class="stat-val" style="color: var(--success); font-size: 14px;">ACTIVE</span>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Identity</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-body">
                            <tr><td colspan="2" style="text-align:center; padding: 20px;">No records synced.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Panel: History -->
        <div id="panel-history" class="panel">
            <span class="section-label">Archive Retrieval</span>
            <div class="card">
                <h2>Past Sessions</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <input type="text" id="search-lec" placeholder="Lecturer ID">
                    <button style="width: 60px; padding: 0;" onclick="checkSessionsAct()"><i class="fa-solid fa-search"></i></button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Course</th>
                                <th>Ref</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="sessions-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <nav class="dock">
        <div class="nav-item" id="btn-panel-create" onclick="switchPanel('panel-create')">
            <i class="fa-solid fa-plus-square"></i>
            <span>Create</span>
        </div>
        <div class="nav-item active" id="btn-panel-logs" onclick="switchPanel('panel-logs')">
            <i class="fa-solid fa-tower-broadcast"></i>
            <span>Live</span>
        </div>
        <div class="nav-item" id="btn-panel-history" onclick="switchPanel('panel-history')">
            <i class="fa-solid fa-database"></i>
            <span>History</span>
        </div>
    </nav>

    <script>
        let map, marker;
        const FORM_URL = "https://docs.google.com/forms/u/0/d/1WPcBPA3FV4Vya83NXzA7p_98l0RHsQucyD9wVRlhfl0/formResponse";

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([4.2105, 101.9758], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([4.2105, 101.9758], { draggable: true }).addTo(map);
            marker.on('dragend', function() {
                const pos = marker.getLatLng();
                document.getElementById('coords').value = `${pos.lat.toFixed(6)}, ${pos.lng.toFixed(6)}`;
            });
        }

        function switchPanel(id) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
            if(id === 'panel-create') setTimeout(() => map.invalidateSize(), 200);
        }

        document.getElementById('attendance-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            btn.innerText = "UPLOADING...";
            
            const formData = new URLSearchParams();
            formData.append('entry.12763463', document.getElementById('course').value);
            formData.append('entry.478539585', document.getElementById('coords').value);
            formData.append('entry.1749226560', document.getElementById('ref-code').value);
            formData.append('entry.2127034561', document.getElementById('time-in').value);
            formData.append('entry.528203485', document.getElementById('time-out').value);
            formData.append('entry.259351423', document.getElementById('lecturer-email').value);
            formData.append('entry.305737954', document.getElementById('venue-name').value);
            formData.append('entry.301005744', sessionStorage.getItem('userId'));

            try {
                await fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: formData });
                alert("Session Created");
                generateRefCode();
                switchPanel('panel-logs');
            } catch (err) { alert("Network Error"); }
            btn.innerText = "BROADCAST SESSION";
        });

        async function checkAttendanceAct() {
            const ref = document.getElementById('search-ref').value;
            const tbody = document.getElementById('attendance-body');
            if(!ref) return;
            tbody.innerHTML = '<tr><td colspan="2">Fetching...</td></tr>';
            
            const sheetID = "1iI5eSf6NkhFtD1uxkFtuPXBWX7-C0mA1h7LR8jw3JZw";
            const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=StudentAttendance&tq=` + encodeURIComponent(`SELECT * WHERE F = ${ref}`);

            try {
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substring(47).slice(0, -2));
                const rows = json.table.rows;
                tbody.innerHTML = "";
                document.getElementById('ui-students-found').innerText = rows.length;
                rows.forEach(r => {
                    tbody.innerHTML += `<tr><td><b>${r.c[2].v}</b><br><small>${r.c[1].v}</small></td><td>${r.c[0].f.split(' ')[1]}</td></tr>`;
                });
            } catch (e) { tbody.innerHTML = '<tr><td colspan="2">No records found.</td></tr>'; }
        }

        async function checkSessionsAct() {
            const lecId = document.getElementById('search-lec').value;
            const tbody = document.getElementById('sessions-body');
            const sheetID = "1iI5eSf6NkhFtD1uxkFtuPXBWX7-C0mA1h7LR8jw3JZw";
            const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=MainSessionServer&tq=` + encodeURIComponent(`SELECT * WHERE I = '${lecId}'`);

            try {
                const res = await fetch(url);
                const text = await res.text();
                const json = JSON.parse(text.substring(47).slice(0, -2));
                tbody.innerHTML = "";
                json.table.rows.forEach(r => {
                    tbody.innerHTML += `<tr><td>${r.c[1].v}</td><td>${r.c[3].v}</td><td>${r.c[0].f.split(' ')[0]}</td></tr>`;
                });
            } catch (e) { tbody.innerHTML = '<tr><td colspan="3">No history.</td></tr>'; }
        }

        function generateRefCode() { document.getElementById('ref-code').value = Math.floor(10000 + Math.random() * 90000); }
        function handleSignOut() { sessionStorage.clear(); window.location.href = 'index.html'; }

        window.onload = () => {
            initMap();
            generateRefCode();
            document.getElementById('date').valueAsDate = new Date();
            const sid = sessionStorage.getItem('userId');
            if(sid) document.getElementById('search-lec').value = sid;
        };
    </script>
</body>
</html>
