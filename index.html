<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance | Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
   <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --accent: #0071E3;
            --border-width: 2px;
            --shadow: 6px 6px 0px #000000;
            --input-bg: #f4f4f4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Subtle architectural grid background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        #login-container {
            width: 100%;
            max-width: 440px;
            background: white;
            border: var(--border-width) solid var(--fg);
            box-shadow: var(--shadow);
            padding: 48px 40px;
            position: relative;
        }

        .status-badge {
            position: absolute;
            top: -14px;
            left: 20px;
            background: var(--fg);
            color: white;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
        }

        .status-badge.active {
            display: block;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 8px;
            line-height: 1;
        }

        p.subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 16px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 500;
            border: var(--border-width) solid var(--fg);
            background: var(--input-bg);
            outline: none;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        input:focus {
            background: white;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px var(--fg);
        }

        #student-only-fields {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s ease;
        }

        #student-only-fields.visible {
            max-height: 120px;
            opacity: 1;
            margin-top: 5px;
        }

        .actions {
            margin-top: 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 18px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border: var(--border-width) solid var(--fg);
        }

        #submit-btn {
            background-color: var(--fg);
            color: white;
        }

        #submit-btn:hover {
            background-color: white;
            color: var(--fg);
            box-shadow: 4px 4px 0px var(--fg);
            transform: translate(-2px, -2px);
        }

        #submit-btn:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        .secondary-action {
            background: transparent;
            color: #666;
            border-color: transparent;
            font-size: 13px;
            margin-top: 10px;
            text-decoration: underline;
        }

        .secondary-action:hover {
            color: var(--fg);
        }

        /* Responsive */
        @media (max-width: 480px) {
            #login-container {
                padding: 32px 24px;
                border: none;
                box-shadow: none;
            }
            .grid-bg { display: none; }
            h1 { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div id="login-container">
        <div id="badge" class="status-badge">Student detected</div>
        <h1>Portal.</h1>
        <p class="subtitle">Enter your ID to proceed to attendance.</p>
        
        <div class="input-group">
            <label for="user-id">Identification ID</label>
            <input type="text" id="user-id" placeholder="e.g. STU123 or LEC456" oninput="handleIdDetection()" autocomplete="off" spellcheck="false">
        </div>

        <div id="student-only-fields">
            <div class="input-group">
                <label for="ref-code">Session Reference (5-Digits)</label>
                <input type="text" id="ref-code" placeholder="00000" maxlength="5" inputmode="numeric">
            </div>
        </div>

        <div class="actions">
            <button id="submit-btn" onclick="processLogin()">Continue</button>
            <button class="secondary-action" onclick="resetForm()">Trouble logging in?</button>
        </div>
    </div>
    <script>
        const COOLDOWN_MS = 30 * 60 * 1000; // 30 Minutes

        function handleIdDetection() {
            const userId = document.getElementById('user-id').value.toUpperCase();
            const studentSection = document.getElementById('student-only-fields');
            const badge = document.getElementById('badge');
            const submitBtn = document.getElementById('submit-btn');

            if (userId.startsWith('STU')) {
                studentSection.classList.add('visible');
                badge.innerText = "Student Account";
                badge.classList.add('active');
                submitBtn.innerText = "Check In Now";
            } else if (userId.startsWith('LEC')) {
                studentSection.classList.remove('visible');
                badge.innerText = "Lecturer Account";
                badge.classList.add('active');
                submitBtn.innerText = "Go to Dashboard";
            } else {
                studentSection.classList.remove('visible');
                badge.classList.remove('active');
                submitBtn.innerText = "Continue";
            }
        }

        function processLogin() {
            const userId = document.getElementById('user-id').value;
            if (!userId) {
                showFeedback("Please enter an ID");
                return;
            }
            // Logic for authentication would go here
            console.log("Processing login for:", userId);
            verifyAndLogin(userId.startsWith('STU') ? 'student' : (userId.startsWith('LEC') ? 'lecturer' : 'unknown'));
        }

        function showFeedback(msg) {
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerText;
            btn.innerText = msg;
            btn.style.borderColor = 'red';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.borderColor = '';
            }, 2000);
        }

        function resetForm() {
            document.getElementById('user-id').value = '';
            handleIdDetection();
        }

        function toggleFields() {
            const idInput = document.getElementById('user-id').value.toUpperCase();
            const extraFields = document.getElementById('student-only-fields');
            
            if (idInput.startsWith('STU')) {
                extraFields.classList.add('visible');
            } else {
                extraFields.classList.remove('visible');
            }
        }

        function verifyAndLogin(role) {
            const idInput = document.getElementById('user-id').value.trim();
            const refInput = document.getElementById('ref-code').value.trim();

            if (!idInput) {
                alert("Please enter your ID.");
                return;
            }

            // STUDENT LOGIC
            if (role === 'student') {

                // 2. Validate Credentials
                const isValidId = (idInput === 'STU123');
                const isValidRef = (refInput.length === 5 && !isNaN(refInput));

                if (isValidId && isValidRef) {
                    sessionStorage.setItem('userRole', role);
                    sessionStorage.setItem('userId', idInput);
                    sessionStorage.setItem('refCode', refInput);
                    window.location.href = role + ".html";
                } else if (!isValidId) {
                    alert("Invalid Student ID.");
                } else {
                    alert("Reference Code must be exactly 5 digits.");
                }
                return;
            }

            // LECTURER LOGIC
            if (role === 'lecturer' && idInput === 'LEC456') {
                sessionStorage.setItem('userRole', role);
                sessionStorage.setItem('userId', idInput);
                window.location.href = role + ".html";
                return;
            }

            alert("Access Denied: ID not recognized.");
        }
    </script>
</body>
</html>
