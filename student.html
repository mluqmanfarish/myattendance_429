<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Check-In | Student</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script>
        (function protectPage() {
            const role = sessionStorage.getItem('userRole');
            const userId = sessionStorage.getItem('userId');
            const latestTimeSuccess = localStorage.getItem('latestTimeSuccess');
            const COOLDOWN_PERIOD = 30 * 60 * 1000; 
            const durationSinceLastSuccess = Date.now() - (latestTimeSuccess || 0);

            if (!role || !userId || role !== 'student') {
                window.location.href = 'index.html';
            } else if (durationSinceLastSuccess < COOLDOWN_PERIOD) {
                const remainingTime = Math.ceil((COOLDOWN_PERIOD - durationSinceLastSuccess) / 60000);
                alert(`You have recently marked attendance. Please wait ${remainingTime} minutes before trying again.`);
                window.location.href = 'index.html';
            }
        })();
    </script>

    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --accent: #0071E3;
            --success: #34C759;
            --error: #FF3B30;
            --border-width: 2px;
            --shadow: 6px 6px 0px #000000;
            --input-bg: #f4f4f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        #attendance-card {
            width: 100%;
            max-width: 440px;
            background: white;
            border: var(--border-width) solid var(--fg);
            box-shadow: var(--shadow);
            padding: 40px;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Status Visualizer */
        .status-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .status-dot-wrapper {
            width: 24px;
            height: 24px;
            border: 2px solid var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: var(--fg);
            transition: all 0.4s ease;
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        /* Information Blocks */
        .section-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #888;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin: 25px 0 15px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .label {
            font-weight: 500;
            color: #666;
        }

        .value {
            font-weight: 700;
            text-align: right;
        }

        /* Button Logic */
        button {
            width: 100%;
            padding: 20px;
            margin-top: 40px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border: var(--border-width) solid var(--fg);
            background: var(--fg);
            color: white;
        }

        button:hover:not(:disabled) {
            background: white;
            color: var(--fg);
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px var(--fg);
        }

        button:disabled {
            background: #eee;
            border-color: #ccc;
            color: #aaa;
            cursor: not-allowed;
        }

        /* State Modifiers */
        .is-loading .status-dot { background: var(--accent); animation: flash 1s infinite; }
        .is-success { border-color: var(--success) !important; box-shadow: 6px 6px 0px var(--success) !important; }
        .is-success .status-dot { background: var(--success); }
        .is-success h2 { color: var(--success); }
        .is-success button { background: var(--success); border-color: var(--success); }

        .is-error { border-color: var(--error) !important; box-shadow: 6px 6px 0px var(--error) !important; }
        .is-error .status-dot { background: var(--error); }
        .is-error h2 { color: var(--error); }

        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        @media (max-width: 480px) {
            #attendance-card { padding: 30px 20px; border: none; box-shadow: none; }
            .grid-bg { display: none; }
        }
    </style>
</head>

<body>
    <div class="grid-bg"></div>

    <div id="attendance-card">
        <div class="status-container">
            <div class="status-dot-wrapper">
                <div class="status-dot"></div>
            </div>
            <h2 id="status-text">Station Ready</h2>
        </div>

        <div class="section-header">Student Profile</div>
        <div class="data-grid">
            <div class="data-row"><span class="label">ID</span><span id='student-id' class="value">---</span></div>
            <div class="data-row"><span class="label">Name</span><span id='student-name' class="value">---</span></div>
            <div class="data-row"><span class="label">Current Location</span><span id="val-current-name" class="value">Not Detected</span></div>
        </div>

        <div class="section-header">Class Details</div>
        <div class="data-grid">
            <div class="data-row"><span class="label">Course</span><span id="val-course-name" class="value">---</span></div>
            <div class="data-row"><span class="label">Target Venue</span><span id="val-target-name" class="value">---</span></div>
            <div class="data-row"><span class="label">Distance</span><span id="val-distance" class="value">--</span></div>
            <div class="data-row"><span class="label">Sync Time</span><span id="val-time" class="value">--:--</span></div>
            <div class="data-row"><span class="label">Ref Code</span><span id="val-ref-code" class="value">---</span></div>
        </div>

        <button id="action-btn" onclick="handleAttendance()">Confirm Attendance</button>
    </div>

<script>
const THRESHOLD_KM = 0.3; 
const FORM_URL = "https://docs.google.com/forms/u/0/d/1lWPkeQRomJdfuRU2ZzEmfDNVCPo8Lcw6LxK0Cv_PPkc/formResponse";

let foundData = null;

// ================= INIT =================
document.getElementById('student-id').innerText = sessionStorage.getItem('userId') || 'Guest';
document.getElementById('student-name').innerText = sessionStorage.getItem('userName') || '---';
document.getElementById('val-ref-code').innerText = sessionStorage.getItem('refCode') || '---';

// ================= FETCH GOOGLE SHEET =================
const sheetID = "1iI5eSf6NkhFtD1uxkFtuPXBWX7-C0mA1h7LR8jw3JZw";
const sheetName = "MainSessionServer";
const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;

fetch(url)
.then(res => res.text())
.then(data => {
    const jsonText = data.match(/google\.visualization\.Query\.setResponse\(([\s\S\w]+)\)/);
    if (!jsonText) throw new Error("Invalid JSON");

    const json = JSON.parse(jsonText[1]);
    const rows = json.table.rows;
    const cols = json.table.cols.map(col => col.label);

    const result = rows.map(r => {
        let obj = {};
        r.c.forEach((cell, i) => {
            if (cols[i]) obj[cols[i]] = cell ? cell.v : "";
        });
        return obj;
    });

    const searchRef = sessionStorage.getItem('refCode');
    foundData = result.find(row => String(row["REFCODE"]) === searchRef);

    if (foundData) {
        document.getElementById("val-target-name").innerText = foundData.COORDINATE;
        document.getElementById("val-course-name").innerText = foundData.COURSE_NAME;
    }
})
.catch(err => console.error("Fetch error:", err));

// ================= HELPERS =================
function parseCoordinate(coordStr) {
    const [lat, lon] = coordStr.split(',').map(Number);
    return [lat, lon];
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

const getCoords = () => new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true }));

function setUIState(state, message, btnLabel) {
    const card = document.getElementById("attendance-card");
    const statusText = document.getElementById("status-text");
    const btn = document.getElementById("action-btn");

    card.classList.remove('is-loading', 'is-success', 'is-error');
    if (state) card.classList.add(`is-${state}`);

    if (message) statusText.innerText = message;
    if (btnLabel) btn.innerText = btnLabel;

    btn.disabled = (state === 'loading' || state === 'success');
}

// ================= SEND =================
async function sendToGoogleForm(data) {
    const formData = new URLSearchParams();
    formData.append('entry.1635954407', data.timestamp);
    formData.append('entry.533702816', data.studentId);
    formData.append('entry.1656191659', data.studentName);
    formData.append('entry.1441013951', data.distance);
    formData.append('entry.1461474313', data.location);
    formData.append('entry.532483027', data.refCode);

    await fetch(FORM_URL, { method: 'POST', mode: 'no-cors', body: formData });
    localStorage.setItem('lastAttendanceTime', Date.now().toString());
}

// ================= MAIN =================
async function handleAttendance() {
    setUIState('loading', 'Syncing...', 'Validating');

    try {
        if (!foundData || !foundData.COORDINATE) {
            setUIState('error', 'Venue Missing', 'Retry');
            return;
        }

        const pos = await getCoords();
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const [latVenue, lonVenue] = parseCoordinate(foundData.COORDINATE);
        const d = calculateDistance(lat, lon, latVenue, lonVenue);

        const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const formattedDist = d < 1 ? `${(d * 1000).toFixed(0)} m` : `${d.toFixed(2)} km`;

        document.getElementById("val-distance").innerText = formattedDist;
        document.getElementById("val-time").innerText = timeNow;
        document.getElementById("val-current-name").innerText = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;

        if (d <= THRESHOLD_KM) {
            await sendToGoogleForm({
                timestamp: timeNow,
                studentId: sessionStorage.getItem('userId'),
                studentName: sessionStorage.getItem('userName'),
                distance: formattedDist,
                location: `${lat}, ${lon}`,
                refCode: sessionStorage.getItem('refCode')
            });
            localStorage.setItem('latestTimeSuccess', Date.now());
            setUIState('success', 'Verified', 'Success');
        } else {
            setUIState('error', 'Out of Range', 'Retry');
        }
    } catch (err) {
        setUIState('error', 'Signal Lost', 'Retry');
    }
}
</script>
</body>
</html>
